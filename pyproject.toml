[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "net-razor"
version = "0.1.0"
description = "MCP-first local research runtime for X, Hacker News, arXiv, and podcasts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    # Upper bound on purpose, for the same reason the `<2` bound existed: an
    # unattended `pip install -U` must not move the server across a protocol era
    # on its own. 2.x speaks the 2026-07-28 revision and still serves every
    # earlier one; the 1.x line is maintenance-only. 3.x will require the
    # deprecations 2.2 warns about, so crossing to it stays a deliberate change.
    "mcp>=2.2,<3",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
# Apple Silicon only. Used solely by the podcast Whisper subprocess, which the
# server never imports. ffmpeg must also be on PATH.
whisper = [
    "mlx-whisper>=0.4",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
net-razor = "net_razor.cli.main:main"
net-razor-mcp = "net_razor.mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"net_razor.sources.x" = [
    "vendor/bird-search/*.mjs",
    "vendor/bird-search/*.json",
    "vendor/bird-search/LICENSE",
    "vendor/bird-search/UPSTREAM.md",
    "vendor/bird-search/lib/*.js",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["_reference"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: opt-in tests that call the live X service",
]
addopts = "-m 'not integration'"
