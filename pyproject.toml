[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "net-razor"
version = "0.1.0"
description = "MCP-first local research runtime for X, Hacker News, arXiv, and podcasts."
readme = "README.md"
# Bounded on purpose, for the same reason the mcp pin is. The XML parsing this
# project does on untrusted feeds is safe because of expat's entity-amplification
# limit, and expat ships with the interpreter -- so which interpreter runs is
# part of a security property, not just a compatibility detail. See
# tests/test_podcast_feed_client.py for the property that pins it.
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    # Upper bound on purpose, for the same reason the `<2` bound existed: an
    # unattended `pip install -U` must not move the server across a protocol era
    # on its own. 2.x speaks the 2026-07-28 revision and still serves every
    # earlier one; the 1.x line is maintenance-only. 3.x will require the
    # deprecations 2.2 warns about, so crossing to it stays a deliberate change.
    "mcp>=2.2,<3",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
# Apple Silicon only. Used solely by the podcast Whisper subprocess, which the
# server never imports. ffmpeg must also be on PATH.
whisper = [
    "mlx-whisper>=0.4",
]
dev = [
    # Validates a tool response against the schema the server advertised, which
    # is a different claim from validating it against the Pydantic model the
    # schema came from. Used by tests/test_protocol.py.
    "jsonschema>=4.0",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
net-razor = "net_razor.cli.main:main"
net-razor-mcp = "net_razor.mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"net_razor.sources.x" = [
    "vendor/bird-search/*.mjs",
    "vendor/bird-search/*.json",
    "vendor/bird-search/LICENSE",
    "vendor/bird-search/UPSTREAM.md",
    "vendor/bird-search/lib/*.js",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["_reference"]

[tool.ruff.lint]
# `S` is bandit's security checks. This project runs a subprocess, handles
# session cookies and parses XML from strangers, so they earn their place.
# `ruff format` is deliberately not run: the diff is ~2,600 lines of
# hand-formatted code with no correctness gain, and it would make git blame
# useless across the whole repository.
select = ["B", "C4", "E", "F", "I", "N", "PERF", "RUF", "S", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
# Tests assert, pass fake credentials, and launch subprocesses on purpose.
# Every one of these outside tests is still a finding.
"tests/*" = ["S101", "S105", "S106", "S603"]
"scripts/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: opt-in tests that call the live X service",
]
addopts = "-m 'not integration'"
